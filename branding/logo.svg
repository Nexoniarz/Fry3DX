<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/><stop offset="1" stop-color="#151518"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3b42"/><stop offset="1" stop-color="#1d1d21"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4a1c"/><stop offset="1" stop-color="#ffc24a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- flames under the pan -->
  <path d="M164 462 c -34 -14 -30 -60 0 -96 c 30 36 34 82 0 96 z" fill="url(#flame)"/>
  <path d="M236 462 c -34 -14 -30 -60 0 -96 c 30 36 34 82 0 96 z" fill="url(#flame)"/>
  <path d="M308 462 c -34 -14 -30 -60 0 -96 c 30 36 34 82 0 96 z" fill="url(#flame)"/>
  <!-- handle -->
  <path d="M372 300 L470 250" stroke="#ff7828" stroke-width="30" stroke-linecap="round"/>
  <!-- the pan, seen a little from above -->
  <ellipse cx="236" cy="318" rx="170" ry="72" fill="#ff7828"/>
  <ellipse cx="236" cy="306" rx="150" ry="58" fill="url(#pan)"/>
  <!-- the cube frying in it -->
  <g stroke="#1a1a1d" stroke-width="8" stroke-linejoin="round">
    <path d="M236 92 L330 140 L236 188 L142 140 Z" fill="#ffd2a0"/>
    <path d="M142 140 L236 188 L236 300 L142 252 Z" fill="#ff8a3a"/>
    <path d="M330 140 L236 188 L236 300 L330 252 Z" fill="#c9501a"/>
  </g>
  <!-- sizzle -->
  <g stroke="#ffb070" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M100 210 q-14 -18 0 -36 q14 -18 0 -36"/>
    <path d="M378 200 q-14 -18 0 -36 q14 -18 0 -36"/>
  </g>
</svg>
